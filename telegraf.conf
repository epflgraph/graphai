# ---- outputs: expose a Prometheus /metrics endpoint
[[outputs.prometheus_client]]
  listen = ":9273"
  expiration_interval = "60s"

# ---- inputs: per-process stats
# Celery workers (match the command line)
[[inputs.procstat]]
  pattern = "celery.*workerHigh"
  pid_finder = "native"
  prefix = "celery_worker_high_"

[[inputs.procstat]]
  pattern = "celery.*workerLow"
  pid_finder = "native"
  prefix = "celery_worker_low_"

[[inputs.procstat]]
  pattern = "celery.*workerMid"
  pid_finder = "native"
  prefix = "celery_worker_mid_"

[[inputs.procstat]]
  pattern = "celery.*workerCache"
  pid_finder = "native"
  prefix = "celery_worker_cache_"

# Uvicorn API
[[inputs.procstat]]
  pattern = "uvicorn.*main:app"
  pid_finder = "native"
  prefix = "api_uvicorn_"

# Optional: tag the metrics
[global_tags]
  host = "mac"
  app  = "graphai"
