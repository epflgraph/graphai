[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphai"
version = "0.14.1"
authors = [
  { name="Aitor Pérez", email="aitor.perez@epfl.ch" },
  { name="Ramtin Yazdanian", email="ramtin.yazdanian@epfl.ch" }
]
description = "The graphai package contains tools and services enhancing the EPFL Graph project with AI-based utilities."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "loguru",
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "fastapi>=0.95.0",
  "gunicorn",
  "uvicorn",
  "pydantic",
  "requests",
  "beautifulsoup4",
  "httpx==0.27.2",
  "wget",
  "imagehash",
  "fingerprint",
  "openai",
  "tiktoken",
  "pytesseract",
  "langdetect",
  "google-cloud-vision",
  "google-cloud-storage",
  "ffmpeg-python",
  "pyacoustid",
  "fuzzywuzzy[speedup]",
  "celery[redis]",
  "flower",
  "kombu",
  "mysql-connector-python",
  "elasticsearch",
  "unidecode",
  "clean-text",
  "python-rake",
  "nltk",
  "rake-nltk",
  "levenshtein",
  "wikitext-asymptote",
  "db-cache-manager @ git+https://github.com/epflgraph/db-cache-manager.git",
  "elasticsearch-interface>=1.6.0",
  "scikit-learn",
  "opentelemetry-distro==0.40b0",
  "opentelemetry-exporter-otlp==1.19.0",
  "opentelemetry-instrumentation-fastapi==0.40b0",
  "pyamg",
  "yt-dlp>=2025.4.30",
  "python-multipart",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "pybind11",
  "cachetools",
  "fastapi-user-limiter>=1.3.0",
  "ftfy",
  "pymupdf",
  "pylatexenc",
  "langchain",
  "google-genai",
  "graphai-client>=1.16.0",
  "pdf2image>=1.16,<2",
  "prometheus-fastapi-instrumentator",
  "langchain-text-splitters>=0.2.0",
  "spacy"
]

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "torchaudio",
  "openai-whisper==20250625",
  "transformers",
  "sentencepiece",
  "sacremoses",
  "pysbd",
  "fasttext-wheel",
  "fasttext-reducer>=0.1.1",
  "sentence-transformers<4",
  "presidio_analyzer[transformers]",
  "presidio_anonymizer"
]

dev = [
  "flake8",
  "pytest-celery"
]

docs = [
  "sphinx",
  "sphinx-material",
  "sphinx-rtd-theme"
]

all = [
  "graphai[ml,dev,docs]"
]

[tool.setuptools]
packages = ["graphai"]

[project.urls]
Homepage = "https://graphai.epfl.ch"
Documentation = "https://epflgraph.github.io/graphai/graphai"
"Source code" = "https://github.com/epflgraph/graphai"
"Bug Tracker" = "https://github.com/epflgraph/graphai/issues"
