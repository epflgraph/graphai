x-graphai-env: &graphai-env
  NLTK_DATA: ${NLTK_DATA:-/opt/nltk_data}
  PYTHONPATH: /app
  GRAPH_CACHE_ROOT: ${GRAPH_CACHE_ROOT:-/var/graphai/storage}
  GRAPH_LOG_ROOT: ${GRAPH_LOG_ROOT:-/var/graphai/logs}
  WHISPER_MODEL_ROOT: ${WHISPER_MODEL_ROOT:-/opt/models/whisper}
  HF_HOME: ${HF_HOME:-/opt/models/huggingface}
  SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/opt/models/huggingface}
  FASTTEXT_MODEL_ROOT: ${FASTTEXT_MODEL_ROOT:-/opt/models/fasttext}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  ES_HOST: ${ES_HOST}
  ES_PORT: ${ES_PORT}
  ES_USERNAME: ${ES_USERNAME}
  ES_PASSWORD: ${ES_PASSWORD}
  ES_CAFILE: ${ES_CAFILE}
  API_TITLE: ${API_TITLE:-GraphAI API}

x-graphai-common: &graphai-common
  image: ${GRAPH_IMAGE}
  env_file:
    - .env
  environment:
    <<: *graphai-env
  volumes:
    - ${HOST_CACHE_DIR}:${GRAPH_CACHE_ROOT}
    - ${HOST_LOG_DIR}:${GRAPH_LOG_ROOT}
    - ./certs:/app/certs:ro
    - ./config.ini:/app/config.ini:ro
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  extra_hosts:
    - "graph-engine-test:host-gateway"
  networks:
    - graphai_net

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    container_name: rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_HTTP_PORT:-15672}:15672"
      - "${RABBITMQ_PROM_PORT:-15692}:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - graphai_net

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - graphai_net

  redis-commander:
    image: ${REDIS_COMMANDER_IMAGE:-visol/redis-commander:0.8.0}
    profiles: ["ops"]
    environment:
      REDIS_HOSTS: local:redis:6379:1
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graphai_net

  api:
    <<: *graphai-common
    container_name: graphai_api
    environment:
      <<: *graphai-env
      ES_CAFILE: /app/certs/graph-engine-elasticsearch.crt
      GRAPHAI_ROLE: api
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-28800}
      API_WORKERS: ${API_WORKERS:-1}
      API_PROXY_HEADERS: ${API_PROXY_HEADERS:-1}
      API_FORWARDED_ALLOW_IPS: ${API_FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${API_PORT:-28800}:${API_PORT:-28800}"
    restart: on-failure

  beat:
    <<: *graphai-common
    container_name: graphai_beat
    profiles: ["scheduler"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: beat
      CELERY_LOG_LEVEL: ${CELERY_BEAT_LOG_LEVEL:-info}
    restart: on-failure

  flower:
    <<: *graphai-common
    container_name: graphai_flower
    profiles: ["ops"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: flower
      FLOWER_PORT: ${FLOWER_PORT:-5555}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    ports:
      - "${FLOWER_PORT:-5555}:${FLOWER_PORT:-5555}"
    restart: on-failure

  celery-cpu-cache:
    <<: *graphai-common
    container_name: celery_cpu_cache
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: caching
      CELERY_POOL: ${CELERY_CPU_CACHE_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_CACHE_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_CACHE_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_CACHE_NAME:-RCP_CPUx8_Cache}
      CELERY_LOG_LEVEL: ${CELERY_CPU_CACHE_LOG_LEVEL:-info}
    restart: always

  celery-cpu-rag:
    <<: *graphai-common
    container_name: celery_cpu_rag
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: rag
      CELERY_POOL: ${CELERY_CPU_RAG_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_RAG_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_RAG_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_RAG_NAME:-RCP_CPUx8_Rag}
      CELERY_LOG_LEVEL: ${CELERY_CPU_RAG_LOG_LEVEL:-info}
    restart: always

  celery-cpu-img:
    <<: *graphai-common
    container_name: celery_cpu_img
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: image
      CELERY_POOL: ${CELERY_CPU_IMG_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_IMG_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_IMG_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_IMG_NAME:-RCP_CPUx8_Img}
      CELERY_LOG_LEVEL: ${CELERY_CPU_IMG_LOG_LEVEL:-info}
    restart: always

  celery-cpu-embedding:
    <<: *graphai-common
    container_name: celery_cpu_embedding
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: embedding
      CELERY_POOL: ${CELERY_CPU_EMBED_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_EMBED_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_EMBED_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_EMBED_NAME:-RCP_CPUx6_Embedding}
      CELERY_LOG_LEVEL: ${CELERY_CPU_EMBED_LOG_LEVEL:-info}
    restart: on-failure

  celery-cpu-text:
    <<: *graphai-common
    container_name: celery_cpu_text
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: text
      CELERY_POOL: ${CELERY_CPU_TEXT_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_TEXT_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_TEXT_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_TEXT_NAME:-RCP_CPUx16_Text}
      CELERY_LOG_LEVEL: ${CELERY_CPU_TEXT_LOG_LEVEL:-info}
    restart: on-failure

  celery-cpu-video-voice-transl:
    <<: *graphai-common
    container_name: celery_cpu_video_voice_transl
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: video,voice,translation
      CELERY_POOL: ${CELERY_CPU_VVT_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_VVT_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_VVT_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_VVT_NAME:-RCP_CPUx6_Video_Voice_Transl}
      CELERY_LOG_LEVEL: ${CELERY_CPU_VVT_LOG_LEVEL:-info}
    restart: on-failure

  celery-cpu-ontl-scrp-celery:
    <<: *graphai-common
    container_name: celery_cpu_ontl_scrp_celery
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: ontology,scraping,celery
      CELERY_POOL: ${CELERY_CPU_MISC_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_MISC_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_MISC_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_MISC_NAME:-RCP_CPUx6_Ontl_Scrp_Celery}
      CELERY_LOG_LEVEL: ${CELERY_CPU_MISC_LOG_LEVEL:-info}
    restart: always

  celery-gpu0-embedding:
    <<: *graphai-common
    container_name: celery_gpu0_embedding
    profiles: ["gpu"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CUDA_VISIBLE_DEVICES: "${GPU0_ID:-0}"
      CELERY_QUEUES: embedding_gpu
      CELERY_CONCURRENCY: ${CELERY_GPU_EMBED_CONCURRENCY:-1}
      CELERY_WORKER_NAME: ${CELERY_GPU_EMBED_NAME:-RCP_GPU0_Embedding}
      CELERY_LOG_LEVEL: ${CELERY_GPU_EMBED_LOG_LEVEL:-info}
    gpus: all
    restart: on-failure

  celery-gpu1-voice:
    <<: *graphai-common
    container_name: celery_gpu1_voice
    profiles: ["gpu"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CUDA_VISIBLE_DEVICES: "${GPU1_ID:-1}"
      CELERY_QUEUES: voice_gpu
      CELERY_CONCURRENCY: ${CELERY_GPU_VOICE1_CONCURRENCY:-1}
      CELERY_WORKER_NAME: ${CELERY_GPU_VOICE1_NAME:-RCP_GPU1_Voice}
      CELERY_LOG_LEVEL: ${CELERY_GPU_VOICE1_LOG_LEVEL:-info}
    gpus: all
    restart: on-failure

  celery-gpu2-voice:
    <<: *graphai-common
    container_name: celery_gpu2_voice
    profiles: ["gpu"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CUDA_VISIBLE_DEVICES: "${GPU2_ID:-2}"
      CELERY_QUEUES: voice_gpu
      CELERY_CONCURRENCY: ${CELERY_GPU_VOICE2_CONCURRENCY:-1}
      CELERY_WORKER_NAME: ${CELERY_GPU_VOICE2_NAME:-RCP_GPU2_Voice}
      CELERY_LOG_LEVEL: ${CELERY_GPU_VOICE2_LOG_LEVEL:-info}
    gpus: all
    restart: on-failure

  celery-gpu3-translation:
    <<: *graphai-common
    container_name: celery_gpu3_translation
    profiles: ["gpu"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CUDA_VISIBLE_DEVICES: "${GPU3_ID:-3}"
      CELERY_QUEUES: translation_gpu
      CELERY_CONCURRENCY: ${CELERY_GPU_TRANSL_CONCURRENCY:-1}
      CELERY_WORKER_NAME: ${CELERY_GPU_TRANSL_NAME:-RCP_GPU3_Translation}
      CELERY_LOG_LEVEL: ${CELERY_GPU_TRANSL_LOG_LEVEL:-info}
    gpus: all
    restart: on-failure

  celery-cpu-fallback-embedding-gpuq:
    <<: *graphai-common
    container_name: celery_cpu_fallback_embedding_gpuq
    profiles: ["cpu-fallback"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: embedding_gpu
      CELERY_POOL: ${CELERY_CPU_FALLBACK_EMBED_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_FALLBACK_EMBED_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_FALLBACK_EMBED_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_FALLBACK_EMBED_NAME:-RCP_CPU_Fallback_Embedding_GPUQ}
      CELERY_LOG_LEVEL: ${CELERY_CPU_FALLBACK_EMBED_LOG_LEVEL:-info}
    restart: on-failure

  celery-cpu-fallback-voice-gpuq:
    <<: *graphai-common
    container_name: celery_cpu_fallback_voice_gpuq
    profiles: ["cpu-fallback"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: voice_gpu
      CELERY_POOL: ${CELERY_CPU_FALLBACK_VOICE_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_FALLBACK_VOICE_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_FALLBACK_VOICE_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_FALLBACK_VOICE_NAME:-RCP_CPU_Fallback_Voice_GPUQ}
      CELERY_LOG_LEVEL: ${CELERY_CPU_FALLBACK_VOICE_LOG_LEVEL:-info}
    restart: on-failure

  celery-cpu-fallback-translation-gpuq:
    <<: *graphai-common
    container_name: celery_cpu_fallback_translation_gpuq
    profiles: ["cpu-fallback"]
    environment:
      <<: *graphai-env
      GRAPHAI_ROLE: worker
      CELERY_QUEUES: translation_gpu
      CELERY_POOL: ${CELERY_CPU_FALLBACK_TRANSL_POOL:-prefork}
      CELERY_CONCURRENCY: ${CELERY_CPU_FALLBACK_TRANSL_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_CPU_FALLBACK_TRANSL_PREFETCH:-1}
      CELERY_WORKER_NAME: ${CELERY_CPU_FALLBACK_TRANSL_NAME:-RCP_CPU_Fallback_Translation_GPUQ}
      CELERY_LOG_LEVEL: ${CELERY_CPU_FALLBACK_TRANSL_LOG_LEVEL:-info}
    restart: on-failure

  celery_exporter:
    image: ${CELERY_EXPORTER_IMAGE:-danihodovic/celery-exporter:latest}
    profiles: ["observability"]
    platform: ${CELERY_EXPORTER_PLATFORM:-linux/amd64}
    env_file:
      - .env
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CE_ACCEPT_CONTENT: ${CE_ACCEPT_CONTENT:-pickle,json}
      CE_RETRY_INTERVAL: ${CE_RETRY_INTERVAL:-5}
    ports:
      - "${CELERY_EXPORTER_PORT:-9808}:9808"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graphai_net

  docker_stats_exporter:
    image: ${DOCKER_STATS_EXPORTER_IMAGE:-wywywywy/docker_stats_exporter:latest}
    container_name: docker_stats_exporter
    profiles: ["observability"]
    ports:
      - "${DOCKER_STATS_EXPORTER_PORT:-9417}:9487"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - graphai_net

  nvidia_gpu_exporter:
    image: ${NVIDIA_GPU_EXPORTER_IMAGE:-nvidia/dcgm-exporter:latest}
    container_name: nvidia_gpu_exporter
    profiles: ["gpu", "observability"]
    environment:
      DCGM_EXPORTER_LISTEN: :9400
    ports:
      - "${NVIDIA_GPU_EXPORTER_PORT:-9400}:9400"
    restart: unless-stopped
    gpus: all
    networks:
      - graphai_net

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.10}
    container_name: promtail
    profiles: ["observability"]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./promtail-positions.yaml:/tmp/positions.yaml
      - ${HOST_LOG_DIR}:/var/graphai/logs:ro
    restart: always
    networks:
      - graphai_net

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.25-alpine}
    container_name: nginx_graphai
    profiles: ["proxy"]
    network_mode: "host"
    volumes:
      - ./nginx.graphai-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/dockerhost/graphcert.cede-apps.ch:/etc/nginx/certs:ro
    restart: unless-stopped

networks:
  graphai_net:
    name: graphai_net
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data: