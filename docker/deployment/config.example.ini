[celery]
broker_url: amqp://guest:guest@rabbitmq:5672//
result_backend: redis://redis:6379/1

[database]
host: localhost
port: 3306
user: ...
password: ...

[auth]
schema: auth_graphai
secret_key: ...

[elasticsearch]
host: localhost
port: 9200
username: ...
password: ...
cafile: /app/certs/graph-engine-elasticsearch.crt
concept_detection_index: concepts_detection_2025-06-26

[chatbot]
host: localhost
port: 5100

[cache]
schema: cache_graphai
root: /var/graphai/storage

[fingerprint]
text: 1.0
image: 1.0
audio: 1.0
video: 1.0

[whisper]
model_type: base
model_path: /opt/models/whisper

[huggingface]
model_path: /opt/models/huggingface

[fasttext]
path: /opt/models/fasttext
dim: 30

[google]
api_key: <api_key>

[cleanup]
interval: 30

[preload]
video: yes
text: yes
ontology: no

[ratelimiting]
limit: unlimited
custom_limits:

[logging]
path: /var/graphai/logs
server_name: graphai_local