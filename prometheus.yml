global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'celery'
    static_configs:
      - targets: ['celery_exporter:9808']

  - job_name: 'docker-stats'
    static_configs:
      - targets: ['docker_stats_exporter:9417']

  # # Enable only if you run on Linux and start the cAdvisor service with `--profile linux-only`
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']