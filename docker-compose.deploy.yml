version: "3.9"

x-graphai-common: &graphai-common
  image: ${GRAPH_IMAGE:-graphai-self-contained:latest}
  env_file:
    - .env
  environment:
    NLTK_DATA: ${NLTK_DATA:-/opt/nltk_data}
    PYTHONPATH: /app
    CACHE_ROOT: ${CACHE_ROOT:-/var/graphai/storage}
    LOG_PATH: ${LOG_PATH:-/var/graphai/logs}
    WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/opt/models/whisper}
    HUGGINGFACE_MODEL_PATH: ${HUGGINGFACE_MODEL_PATH:-/opt/models/huggingface}
    FASTTEXT_MODEL_PATH: ${FASTTEXT_MODEL_PATH:-/opt/models/fasttext}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    DB_USER: ${DB_USER:-graphai}
    DB_PASSWORD: ${DB_PASSWORD:-graphai}
    ES_HOST: ${ES_HOST:-elasticsearch}
    ES_PORT: ${ES_PORT:-9200}
    ES_USERNAME: ${ES_USERNAME:-elastic}
    ES_PASSWORD: ${ES_PASSWORD:-changeme}
    API_TITLE: ${API_TITLE:-EPFL Graph AI API @ RCP 🔥}
  working_dir: /app/graphai/api/main
  entrypoint: ["/bin/bash", "-lc"]
  volumes:
    - graphai_cache:/var/graphai/storage
    - graphai_logs:/var/graphai/logs
    - graphai_models:/opt/models
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_started

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_HTTP_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql:
    profiles: ["local-infra"]
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-graphai}
      MYSQL_USER: ${MYSQL_USER:-graphai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-graphai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    profiles: ["local-infra"]
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${ES_SECURITY_ENABLED:-false}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  api:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        uvicorn main:app \
          --host ${API_HOST:-0.0.0.0} \
          --port ${API_PORT:-28800} \
          --workers ${API_WORKERS:-1} \
          --proxy-headers \
          --forwarded-allow-ips "${API_FORWARDED_ALLOW_IPS:-*}"
    ports:
      - "${API_PORT:-28800}:${API_PORT:-28800}"
    restart: on-failure

  celery-cpu-cache:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_CACHE_POOL:-prefork} \
          -c ${CELERY_CPU_CACHE_CONCURRENCY:-8} \
          --prefetch-multiplier=${CELERY_CPU_CACHE_PREFETCH:-1} \
          -Q caching \
          -n ${CELERY_CPU_CACHE_NAME:-RCP_CPUx8_Cache}
    restart: always

  celery-cpu-rag:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_RAG_POOL:-prefork} \
          -c ${CELERY_CPU_RAG_CONCURRENCY:-8} \
          --prefetch-multiplier=${CELERY_CPU_RAG_PREFETCH:-1} \
          -Q rag \
          -n ${CELERY_CPU_RAG_NAME:-RCP_CPUx8_Rag}
    restart: always

  celery-cpu-img:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_IMG_POOL:-prefork} \
          -c ${CELERY_CPU_IMG_CONCURRENCY:-8} \
          --prefetch-multiplier=${CELERY_CPU_IMG_PREFETCH:-1} \
          -Q image \
          -n ${CELERY_CPU_IMG_NAME:-RCP_CPUx8_Img}
    restart: always

  celery-cpu-embedding:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_EMBED_POOL:-prefork} \
          -c ${CELERY_CPU_EMBED_CONCURRENCY:-6} \
          --prefetch-multiplier=${CELERY_CPU_EMBED_PREFETCH:-1} \
          -Q embedding \
          -n ${CELERY_CPU_EMBED_NAME:-RCP_CPUx6_Embedding}
    restart: on-failure

  celery-cpu-text:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_TEXT_POOL:-prefork} \
          -c ${CELERY_CPU_TEXT_CONCURRENCY:-16} \
          --prefetch-multiplier=${CELERY_CPU_TEXT_PREFETCH:-16} \
          -Q text \
          -n ${CELERY_CPU_TEXT_NAME:-RCP_CPUx16_Text}
    restart: on-failure

  celery-cpu-video-voice-transl:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_VVT_POOL:-prefork} \
          -c ${CELERY_CPU_VVT_CONCURRENCY:-6} \
          --prefetch-multiplier=${CELERY_CPU_VVT_PREFETCH:-1} \
          -Q video,voice,translation \
          -n ${CELERY_CPU_VVT_NAME:-RCP_CPUx6_Video_Voice_Transl}
    restart: on-failure

  celery-cpu-ontl-scrp-celery:
    <<: *graphai-common
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_MISC_POOL:-prefork} \
          -c ${CELERY_CPU_MISC_CONCURRENCY:-2} \
          --prefetch-multiplier=${CELERY_CPU_MISC_PREFETCH:-1} \
          -Q ontology,scraping,celery \
          -n ${CELERY_CPU_MISC_NAME:-RCP_CPUx6_Ontl_Scrp_Celery}
    restart: always

  celery-gpu0-embedding:
    <<: *graphai-common
    profiles: ["gpu"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        CUDA_VISIBLE_DEVICES=${GPU0_ID:-0} celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -Q embedding_gpu \
          --concurrency=${CELERY_GPU_EMBED_CONCURRENCY:-1} \
          -n ${CELERY_GPU_EMBED_NAME:-RCP_GPU0_Embedding}
    gpus: all
    restart: on-failure

  celery-gpu1-voice:
    <<: *graphai-common
    profiles: ["gpu"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        CUDA_VISIBLE_DEVICES=${GPU1_ID:-1} celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -Q voice_gpu \
          --concurrency=${CELERY_GPU_VOICE1_CONCURRENCY:-1} \
          -n ${CELERY_GPU_VOICE1_NAME:-RCP_GPU1_Voice}
    gpus: all
    restart: on-failure

  celery-gpu2-voice:
    <<: *graphai-common
    profiles: ["gpu"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        CUDA_VISIBLE_DEVICES=${GPU2_ID:-2} celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -Q voice_gpu \
          --concurrency=${CELERY_GPU_VOICE2_CONCURRENCY:-1} \
          -n ${CELERY_GPU_VOICE2_NAME:-RCP_GPU2_Voice}
    gpus: all
    restart: on-failure

  celery-gpu3-translation:
    <<: *graphai-common
    profiles: ["gpu"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        CUDA_VISIBLE_DEVICES=${GPU3_ID:-3} celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -Q translation_gpu \
          --concurrency=${CELERY_GPU_TRANSL_CONCURRENCY:-1} \
          -n ${CELERY_GPU_TRANSL_NAME:-RCP_GPU3_Translation}
    gpus: all
    restart: on-failure

  celery-cpu-fallback-embedding-gpuq:
    <<: *graphai-common
    profiles: ["cpu-fallback"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_FALLBACK_EMBED_POOL:-prefork} \
          -c ${CELERY_CPU_FALLBACK_EMBED_CONCURRENCY:-1} \
          --prefetch-multiplier=${CELERY_CPU_FALLBACK_EMBED_PREFETCH:-1} \
          -Q embedding_gpu \
          -n ${CELERY_CPU_FALLBACK_EMBED_NAME:-RCP_CPU_Fallback_Embedding_GPUQ}
    restart: on-failure

  celery-cpu-fallback-voice-gpuq:
    <<: *graphai-common
    profiles: ["cpu-fallback"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_FALLBACK_VOICE_POOL:-prefork} \
          -c ${CELERY_CPU_FALLBACK_VOICE_CONCURRENCY:-2} \
          --prefetch-multiplier=${CELERY_CPU_FALLBACK_VOICE_PREFETCH:-1} \
          -Q voice_gpu \
          -n ${CELERY_CPU_FALLBACK_VOICE_NAME:-RCP_CPU_Fallback_Voice_GPUQ}
    restart: on-failure

  celery-cpu-fallback-translation-gpuq:
    <<: *graphai-common
    profiles: ["cpu-fallback"]
    command:
      - |
        python /app/docker/runtime_config.py && \
        celery --broker="${CELERY_BROKER_URL}" -A main.celery_instance worker -l info \
          -P ${CELERY_CPU_FALLBACK_TRANSL_POOL:-prefork} \
          -c ${CELERY_CPU_FALLBACK_TRANSL_CONCURRENCY:-1} \
          --prefetch-multiplier=${CELERY_CPU_FALLBACK_TRANSL_PREFETCH:-1} \
          -Q translation_gpu \
          -n ${CELERY_CPU_FALLBACK_TRANSL_NAME:-RCP_CPU_Fallback_Translation_GPUQ}
    restart: on-failure

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.10}
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./promtail-positions.yaml:/tmp/positions.yaml
      - graphai_logs:/var/graphai/logs:ro
    restart: always
    profiles: ["observability"]

volumes:
  rabbitmq_data:
  redis_data:
  mysql_data:
  es_data:
  graphai_cache:
  graphai_logs:
  graphai_models:
