# =========================
# GraphAI HTTPS Reverse Proxy
# =========================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name graphai.epfl.ch _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name graphai.epfl.ch _;

    # --- TLS certs (your own certs) ---
    # http.crt should be the server certificate (ideally fullchain).
    # If your http.crt is NOT a full chain, see the note below about fullchain.pem.
    ssl_certificate     /etc/nginx/certs/graphai-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/graphai-http.key;

    # (Optional but recommended) Let nginx send the full chain to clients
    # If you have a separate intermediate/CA bundle, build a fullchain (see notes).
    ssl_trusted_certificate /etc/nginx/certs/ca.crt;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Reasonable security headers (safe defaults)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # If you know you'll only ever serve via HTTPS:
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Increase if you upload large files
    client_max_body_size 200m;

    # Proxy to GraphAI API
    location / {
        proxy_pass http://127.0.0.1:28800;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (harmless even if unused)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long requests (RAG, audio/video, etc.)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
