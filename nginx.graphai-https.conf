# =========================
# GraphAI HTTPS Reverse Proxy
# =========================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    #listen [::]:80;
    server_name graphai.graphcert.cede-apps.ch;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    #listen [::]:443 ssl;
    http2 on;

    server_name graphai.graphcert.cede-apps.ch;

    add_header Content-Security-Policy "frame-ancestors 'self' graphai.graphcert.cede-apps.ch;";

    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_certificate /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling off;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security max-age=15768000;

    # Increase if you upload large files
    client_max_body_size 200m;

    # # Proxy to GraphAI API
    # location / {
    #     proxy_pass http://127.0.0.1:28800;

    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # WebSocket support (harmless even if unused)
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";

    #     # Long requests (RAG, audio/video, etc.)
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 600s;
    #     proxy_read_timeout 600s;
    # }

    # Managing literal requests to "xxx.graphcert.cede-apps.ch"
    location / {
        proxy_pass http://127.0.0.1:28800;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # websocket headers
        proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # timeouts 
        proxy_read_timeout    3600;  # If the proxied server does not transmit anything within this time, the connection is closed.
        proxy_send_timeout    3600;  # If the proxied server does not receive anything within this time, the connection is closed.
    }    
}
