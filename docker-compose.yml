services:

  # RabbitMQ with Management UI and Prometheus plugin
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # mgmt UI
      - "15692:15692"    # Prometheus metrics (management image has plugin)
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${AI_RABBITMQ_DEV_CELERY_USER}
      RABBITMQ_DEFAULT_PASS: ${AI_RABBITMQ_DEV_CELERY_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  # Redis with AOF persistence
  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: visol/redis-commander:0.8.0   # multi-arch incl. arm64
    environment:
      # - REDIS_HOSTS=local:redis:6379
      - REDIS_HOSTS=local:redis:6379:1
    ports:
      - "8081:8081"
    depends_on: [redis]

  # Celery Prometheus exporter (arm64-friendly)
  celery_exporter:
    image: danihodovic/celery-exporter:latest
    platform: linux/amd64           # on Apple Silicon
    env_file:
      - .env
    environment:
      CE_BROKER_URL: amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672//
      CE_ACCEPT_CONTENT: pickle,json
      CE_RETRY_INTERVAL: "5"        # optional: keep retrying if broker isn’t ready
    ports:
      - "9808:9808"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # Flower for Celery management
  flower:
    image: mher/flower:2.0.1
    container_name: flower
    env_file:
      - .env
    command: >
      celery --broker=amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672// flower
      --port=5555
      --basic_auth=${AI_FLOWER_DEV_CELERY_USER}:${AI_FLOWER_DEV_CELERY_PASS}
    environment:
      - CELERY_BROKER_URL=amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - redis

  # Docker Desktop–friendly container metrics (CPU/RAM/NET/IO) via Docker API
  docker_stats_exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker_stats_exporter
    ports:
      - "9417:9487"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # NVIDIA GPU metrics exporter
  nvidia_gpu_exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: nvidia_gpu_exporter
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
    ports:
      - "9400:9400"
    restart: unless-stopped
    gpus: all
    networks:
      - graphai_net

  # NGINX reverse proxy for GraphAI with HTTPS
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_graphai
    network_mode: "host"
    volumes:
      - ./nginx.graphai-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/dockerhost/graphcert.cede-apps.ch:/etc/nginx/certs:ro
    restart: unless-stopped

networks:
  graphai_net:
    name: graphai_net
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data: