services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # mgmt UI
      - "15692:15692"    # Prometheus metrics (management image has plugin)
    environment:
      RABBITMQ_DEFAULT_USER: graphai
      RABBITMQ_DEFAULT_PASS: graphai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: visol/redis-commander:0.8.0   # multi-arch incl. arm64
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on: [redis]

  # Celery Prometheus exporter (arm64-friendly)
  celery_exporter:
    image: danihodovic/celery-exporter:latest
    platform: linux/amd64           # on Apple Silicon
    environment:
      CE_BROKER_URL: amqp://graphai:graphai@rabbitmq:5672//
      CE_ACCEPT_CONTENT: pickle,json
      CE_RETRY_INTERVAL: "5"        # optional: keep retrying if broker isn’t ready
    ports:
      - "9808:9808"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # Docker Desktop–friendly container metrics (CPU/RAM/NET/IO) via Docker API
  docker_stats_exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker_stats_exporter
    ports:
      - "9417:9417"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rabbitmq
      - celery_exporter
      - docker_stats_exporter

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # # Optional: cAdvisor (only works on real Linux hosts; not Docker Desktop)
  # cadvisor:
  #   image: ghcr.io/google/cadvisor:v0.49.2
  #   container_name: cadvisor
  #   profiles: ["linux-only"]
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:rw
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true # HTTPS on HTTP layer
      - xpack.security.http.ssl.certificate=certs/http.crt
      - xpack.security.http.ssl.key=certs/http.key
      - xpack.security.http.ssl.certificate_authorities=certs/ca.crt
      - xpack.security.transport.ssl.enabled=false # Transport TLS disabled for single-node (ok)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - http.port=9203 # Make ES listen on 9203 to match your mapping
    ports:
      - "9203:9203"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./.certs:/usr/share/elasticsearch/config/certs:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9203 # Match ES URL + port + https
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca.crt # CA path relative to /usr/share/kibana/config
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN} # Service account token tied to THIS ES cluster
      - SERVER_PORT=5604 # Run Kibana on 5604 inside the container to match your mapping
    ports:
      - "5604:5604"
    depends_on:
      - elasticsearch
    volumes:
      - ./.certs:/usr/share/kibana/config/certs:ro

volumes:
  rabbitmq_data:
  redis_data:
  grafana_data:
  es_data:

















