services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # mgmt UI
      - "15692:15692"    # Prometheus metrics (management image has plugin)
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${AI_RABBITMQ_DEV_CELERY_USER}
      RABBITMQ_DEFAULT_PASS: ${AI_RABBITMQ_DEV_CELERY_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: visol/redis-commander:0.8.0   # multi-arch incl. arm64
    environment:
      # - REDIS_HOSTS=local:redis:6379
      - REDIS_HOSTS=local:redis:6379:1
    ports:
      - "8081:8081"
    depends_on: [redis]

  # Celery Prometheus exporter (arm64-friendly)
  celery_exporter:
    image: danihodovic/celery-exporter:latest
    platform: linux/amd64           # on Apple Silicon
    env_file:
      - .env
    environment:
      CE_BROKER_URL: amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672//
      CE_ACCEPT_CONTENT: pickle,json
      CE_RETRY_INTERVAL: "5"        # optional: keep retrying if broker isn’t ready
    ports:
      - "9808:9808"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # Flower for Celery management
  flower:
    image: mher/flower:2.0
    container_name: flower
    env_file:
      - .env
    command: >
      celery --broker=amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672// flower
      --port=5555
      --basic_auth=${AI_FLOWER_DEV_CELERY_USER}:${AI_FLOWER_DEV_CELERY_PASS}
    environment:
      - CELERY_BROKER_URL=amqp://${AI_RABBITMQ_DEV_CELERY_USER}:${AI_RABBITMQ_DEV_CELERY_PASS}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - redis

  # Docker Desktop–friendly container metrics (CPU/RAM/NET/IO) via Docker API
  docker_stats_exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker_stats_exporter
    ports:
      - "9417:9487"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true # HTTPS on HTTP layer
      - xpack.security.http.ssl.certificate=certs/http.crt
      - xpack.security.http.ssl.key=certs/http.key
      - xpack.security.http.ssl.certificate_authorities=certs/ca.crt
      - xpack.security.transport.ssl.enabled=false # Transport TLS disabled for single-node (ok)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - http.port=9203 # Make ES listen on 9203 to match your mapping
    ports:
      - "9203:9203"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./.certs:/usr/share/elasticsearch/config/certs:ro

  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3306:3306"
    networks: [graphai_net, default]
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${AI_MYSQL_DEV_ROOT_PASS}
      MYSQL_DATABASE: graphai
      MYSQL_USER: ${AI_MYSQL_DEV_CELERY_USER}
      MYSQL_PASSWORD: ${AI_MYSQL_DEV_CELERY_PASS}
    command: >
      --mysql-native-password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${AI_MYSQL_DEV_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8082:8080"
    depends_on: [mysql]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks: [graphai_net, default]

  nvidia_gpu_exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: nvidia_gpu_exporter
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
    ports:
      - "9400:9400"
    restart: unless-stopped
    gpus: all
    networks:
      - graphai_net

networks:
  graphai_net:
    name: graphai_net
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  es_data:
  mysql_data: